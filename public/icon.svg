<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dark Neutral Squircle Surface -->
    <linearGradient id="omniSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Emerald Primary Gradient -->
    <linearGradient id="omniEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Teal Secondary Gradient -->
    <linearGradient id="omniTeal" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <!-- Warm Coral AI Spark Gradient -->
    <linearGradient id="omniCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#10B981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#omniSurface)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <!-- Outer Interconnected Orbital Network Ring -->
  <circle cx="32" cy="32" r="23" stroke="url(#omniEmerald)" stroke-width="3" stroke-dasharray="5 3" stroke-opacity="0.8" />

  <!-- Inner Continuous Multi-Platform Flow Ring -->
  <path d="M22 32C22 26.477 26.477 22 32 22C37.523 22 42 26.477 42 32C42 37.523 37.523 42 32 42C26.477 42 22 37.523 22 32Z" 
        stroke="url(#omniTeal)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Dynamic AI Intelligence Spark (4-pointed Star) -->
  <path d="M32 17L33.8 28.2L45 30L33.8 31.8L32 43L30.2 31.8L19 30L30.2 28.2L32 17Z" 
        fill="url(#omniCoral)" filter="url(#emeraldGlow)" />

  <!-- Interconnected Platform Satellites -->
  <circle cx="18" cy="22" r="3" fill="#10B981" />
  <circle cx="46" cy="22" r="3" fill="#0D9488" />
  <circle cx="46" cy="42" r="3" fill="#F43F5E" />
  <circle cx="18" cy="42" r="3" fill="#10B981" />

  <!-- Central Core Photon -->
  <circle cx="32" cy="30" r="2" fill="#FFFFFF" />
</svg>
